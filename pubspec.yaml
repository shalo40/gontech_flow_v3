name: gontech_flow_v2
description: "Sistema de gestión de helpdesk para talleres técnicos - Gontech Flow v3"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Base de datos y almacenamiento
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Estado
  provider: ^6.1.5+1

  # Seguridad
  crypto: ^3.0.7
  local_auth: ^2.3.0

  # Utilidades
  intl: ^0.20.2
  image_picker: ^1.2.0
  dio: ^5.7.0

  # Generación de documentos
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  printing: ^5.12.0
  barcode_widget: ^2.0.4
  open_filex: ^4.5.0

  # Firma digital
  signature: ^5.4.0
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
